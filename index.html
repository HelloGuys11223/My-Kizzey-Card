<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }
        p {
            color: #b3b3b3;
            margin-bottom: 30px;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .link-card {
            background-color: #1e1e1e;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.2s ease;
            border: 1px solid #333;
        }
        .link-card:hover {
            background-color: #2a2a2a;
            transform: translateY(-2px);
        }
        .strawpage {
            border-color: #8b5cf6;
            color: #c084fc;
        }
        .strawpage:hover {
            background-color: #2e1065;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p>Connect with me across the web</p>
        
        <div class="links-container">
            <!-- StrawPage Connection -->
            <a href="https://noobie.straw.page/" class="link-card strawpage" rel="me" target="_blank">StrawPage</a>
            
            <!-- Add your other links here -->
        </div>
    </div>

</body>
</html>
