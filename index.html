<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nooble's Presence Card</title>
  <style>
    body {
      background-color: #0e0e10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .kizzey-card {
      background-color: #111214;
      border: 1px solid #232428;
      border-radius: 16px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1e1f22;
    }

    .activity-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 270px;
    }

    .status-type {
      font-size: 0.68rem;
      font-weight: 700;
      color: #949ba4;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f2f3f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .details, .state {
      font-size: 0.82rem;
      color: #b5bac1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .timer {
      font-size: 0.72rem;
      color: #1db954;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .card-icon {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      margin-left: 10px;
    }

    .footer {
      font-size: 0.7rem;
      color: #80848e;
      text-align: center;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="kizzey-card" id="card-container">
    <div class="activity-item">
      <div class="card-info">
        <div class="status-type">STATUS</div>
        <div class="title">Connecting...</div>
        <div class="details">Establishing real-time link</div>
      </div>
    </div>
  </div>

  <script>
    const USER_ID = "1167583899409465377";
    const WS_URL = "wss://api.lanyard.rest/socket";

    const activityTypes = { 0: "PLAYING", 1: "STREAMING", 2: "LISTENING TO", 3: "WATCHING", 5: "COMPETING IN" };

    let activeTimers = [];
    let heartbeatInterval = null;
    let ws = null;

    function formatMs(ms) {
      if (isNaN(ms) || ms < 0) return "0:00";
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function updateTimers() {
      const now = Date.now();
      activeTimers.forEach(t => {
        const el = document.getElementById(t.id);
        if (!el) return;
        const elapsed = Math.max(0, now - t.start);
        if (t.end) {
          el.innerText = `${formatMs(elapsed)} / ${formatMs(t.end - t.start)}`;
        } else {
          el.innerText = `${formatMs(elapsed)} elapsed`;
        }
      });
    }

    function getImageUrl(data, act) {
      if (act === "spotify" && data.spotify?.album_art_url) return data.spotify.album_art_url;
      if (!act || !act.assets) return null;
      const asset = act.assets.large_image || act.assets.small_image;
      if (!asset) return null;

      if (asset.startsWith("spotify:")) return `https://i.scdn.co/image/${asset.replace("spotify:", "")}`;
      if (asset.startsWith("mp:external/")) {
        if (asset.includes("/https/")) return "https://" + asset.substring(asset.indexOf("/https/") + 7);
        if (asset.includes("/http/")) return "http://" + asset.substring(asset.indexOf("/http/") + 6);
        return `https://media.discordapp.net/external/${asset.replace("mp:external/", "")}`;
      }
      if (act.application_id) return `https://cdn.discordapp.com/app-assets/${act.application_id}/${asset}.png`;
      return null;
    }

    function renderPresence(data) {
      const container = document.getElementById("card-container");
      container.innerHTML = "";
      activeTimers = [];

      let itemsCount = 0;

      if (data.listening_to_spotify) {
        itemsCount++;
        const timerId = `timer-spotify`;
        if (data.spotify.timestamps?.start) {
          activeTimers.push({ id: timerId, start: data.spotify.timestamps.start, end: data.spotify.timestamps.end });
        }
        const imgUrl = getImageUrl(data, "spotify");
        
        container.innerHTML += `
          <div class="activity-item">
            <div class="card-info">
              <div class="status-type">LISTENING TO SPOTIFY</div>
              <div class="title">${data.spotify.song}</div>
              <div class="details">by ${data.spotify.artist}</div>
              <div class="state">${data.spotify.album}</div>
              <div class="timer" id="${timerId}"></div>
            </div>
            ${imgUrl ? `<img class="card-icon" src="${imgUrl}" />` : ''}
          </div>`;
      }

      if (data.activities && data.activities.length > 0) {
        const otherActivities = data.activities.filter(a => {
          if (a.type === 4) return false;
          if (data.listening_to_spotify && a.name.toLowerCase() === "spotify") return false;
          return true;
        });

        otherActivities.forEach((act, idx) => {
          itemsCount++;
          const timerId = `timer-${idx}`;
          if (act.timestamps?.start) {
            activeTimers.push({ id: timerId, start: act.timestamps.start, end: act.timestamps.end });
          }

          const typeLabel = `${activityTypes[act.type] || "ACTIVITY"} ${act.name.toUpperCase()}`;
          const imgUrl = getImageUrl(data, act);

          container.innerHTML += `
            <div class="activity-item">
              <div class="card-info">
                <div class="status-type">${typeLabel}</div>
                <div class="title">${act.details || act.name}</div>
                <div class="details">${act.details ? (act.state || "") : ""}</div>
                <div class="timer" id="${timerId}"></div>
              </div>
              ${imgUrl ? `<img class="card-icon" src="${imgUrl}" />` : ''}
            </div>`;
        });
      }

      if (itemsCount === 0) {
        container.innerHTML = `
          <div class="activity-item">
            <div class="card-info">
              <div class="status-type">DISCORD STATUS</div>
              <div class="title">No Active Activity</div>
              <div class="details">Status: ${(data.discord_status || "ONLINE").toUpperCase()}</div>
            </div>
          </div>`;
      }

      container.innerHTML += `<div class="footer">Template from Kizzey</div>`;
      updateTimers();
    }

    function connectWebSocket() {
      ws = new WebSocket(WS_URL);
      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.op === 1) {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: 3 }));
          }, message.d.heartbeat_interval);
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: USER_ID } }));
        }
        if (message.op === 0 && message.d) renderPresence(message.d);
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }

    connectWebSocket();
    setInterval(updateTimers, 1000);
  </script>
</body>
</html>
