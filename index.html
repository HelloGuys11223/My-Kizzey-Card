<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nooble's Presence</title>
  <style>
    body {
      background-color: #0e0e10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .kizzey-card {
      background-color: #111214;
      border: 1px solid #232428;
      border-radius: 16px;
      padding: 20px;
      width: 380px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .section-header {
      font-size: 0.75rem;
      font-weight: 800;
      color: #80848e;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #2b2d31;
      padding-bottom: 6px;
      margin-bottom: -6px;
    }

    .activity-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-width: 270px;
    }

    .status-type {
      font-size: 0.68rem;
      font-weight: 700;
      color: #949ba4;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #f2f3f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .details, .state {
      font-size: 0.82rem;
      color: #b5bac1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-icon {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <!-- CARD 1: Discord Status -->
  <div class="kizzey-card">
    <div class="section-header">Discord Status</div>
    <div id="discord-container">
      <div class="activity-item">
        <div class="card-info">
          <div class="title">Loading Status...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- CARD 2: Media (Last.fm) -->
  <div class="kizzey-card">
    <div class="section-header" style="color: #d51007;">Now Playing (Last.fm)</div>
    <div id="media-container">
      <div class="activity-item">
        <div class="card-info">
          <div class="title" style="color: #80848e; font-style: italic;">Loading media...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- DISCORD (LANYARD) LOGIC ---
    const USER_ID = "1167583899409465377";
    const WS_URL = "wss://api.lanyard.rest/socket";
    let ws = null;
    let heartbeatInterval = null;

    function renderDiscord(data) {
      const container = document.getElementById("discord-container");
      let dStatus = data.discord_status || "offline";
      let statusColor = "#747f8d";
      
      if (dStatus === "online") statusColor = "#23A55A";
      else if (dStatus === "idle") statusColor = "#F0B132";
      else if (dStatus === "dnd") statusColor = "#F23F42";

      let statusText = dStatus === "offline" ? "OFFLINE / INVISIBLE" : dStatus.toUpperCase();

      container.innerHTML = `
        <div class="activity-item">
          <div class="card-info">
            <div class="status-type">CURRENT STATE</div>
            <div class="title" style="color: ${statusColor};">${statusText}</div>
          </div>
        </div>`;
    }

    function connectWebSocket() {
      ws = new WebSocket(WS_URL);
      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.op === 1) {
          if (heartbeatInterval) clearInterval(heartbeatInterval);
          heartbeatInterval = setInterval(() => {
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ op: 3 }));
          }, message.d.heartbeat_interval);
          ws.send(JSON.stringify({ op: 2, d: { subscribe_to_id: USER_ID } }));
        }
        if (message.op === 0 && message.d) renderDiscord(message.d);
      };
      ws.onclose = () => setTimeout(connectWebSocket, 3000);
    }
    connectWebSocket();

    // --- LAST.FM API LOGIC ---
    const WORKER_LASTFM_URL = "https://my-rpc.grammar-checker.workers.dev/api/lastfm";

    async function fetchMedia() {
      try {
        const res = await fetch(WORKER_LASTFM_URL);
        const data = await res.json();
        const container = document.getElementById("media-container");

        if (!data.is_playing) {
          container.innerHTML = `
            <div class="activity-item">
              <div class="card-info">
                <div class="title" style="color: #80848e; font-style: italic;">Not listening to anything</div>
              </div>
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="activity-item">
            <div class="card-info">
              <div class="status-type" style="color: #d51007;">SCROBBLING</div>
              <div class="title">${data.song}</div>
              <div class="details">by ${data.artist}</div>
              <div class="state">${data.album}</div>
            </div>
            ${data.image ? `<img class="card-icon" src="${data.image}" />` : ''}
          </div>`;
      } catch (err) {
        console.error("Last.fm Fetch Error:", err);
      }
    }

    fetchMedia();
    setInterval(fetchMedia, 5000); // Refreshes every 5 seconds
  </script>
</body>
</html>
