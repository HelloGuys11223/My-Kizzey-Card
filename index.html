<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nooble's Kizzey Presence</title>
  <style>
    body {
      background-color: #0e0e10;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .kizzey-card {
      background-color: #111214;
      border: 1px solid #232428;
      border-radius: 16px;
      padding: 20px;
      width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 240px;
    }

    .status-type {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #949ba4;
      text-transform: uppercase;
    }

    .title {
      font-size: 1rem;
      font-weight: 700;
      color: #f2f3f5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .details, .state {
      font-size: 0.85rem;
      color: #b5bac1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .state-active {
      color: #23a55a;
      font-weight: 600;
    }

    .timer {
      font-size: 0.75rem;
      color: #1db954;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      margin-top: 2px;
    }

    .footer {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #80848e;
    }

    .card-icon {
      width: 70px;
      height: 70px;
      border-radius: 12px;
      object-fit: cover;
      margin-left: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="kizzey-card">
    <div class="card-info">
      <div class="status-type" id="status-type">STATUS</div>
      <div class="title" id="status-title">Loading...</div>
      <div class="details" id="status-details">Fetching live data</div>
      <div class="state state-active" id="status-state">Active</div>
      <div class="timer" id="status-timer"></div>
      <div class="footer">Made with Kizzey</div>
    </div>
    <img id="card-image" class="card-icon" src="" alt="" onerror="this.style.display='none'" />
  </div>

  <script>
    const USER_ID = "1167583899409465377";

    const activityTypes = {
      0: "PLAYING",
      1: "STREAMING",
      2: "LISTENING TO",
      3: "WATCHING",
      4: "CUSTOM STATUS",
      5: "COMPETING IN"
    };

    let activeTimestamps = null;

    function formatMs(ms) {
      if (isNaN(ms) || ms < 0) return "0:00";
      const totalSec = Math.floor(ms / 1000);
      const min = Math.floor(totalSec / 60);
      const sec = Math.floor(totalSec % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    function updateTimer() {
      const timerEl = document.getElementById("status-timer");
      if (!activeTimestamps || !activeTimestamps.start) {
        timerEl.innerText = "";
        return;
      }

      const now = Date.now();
      const elapsedMs = Math.max(0, now - activeTimestamps.start);

      if (activeTimestamps.end) {
        const totalMs = activeTimestamps.end - activeTimestamps.start;
        timerEl.innerText = `${formatMs(elapsedMs)} / ${formatMs(totalMs)}`;
      } else {
        timerEl.innerText = `${formatMs(elapsedMs)} elapsed`;
      }
    }

    function getImageUrl(data, act) {
      if (data.listening_to_spotify && data.spotify?.album_art_url) {
        return data.spotify.album_art_url;
      }
      
      const asset = act?.assets?.large_image;
      if (!asset) return null;

      if (asset.startsWith("spotify:")) {
        return `https://i.scdn.co/image/${asset.replace("spotify:", "")}`;
      }

      if (asset.startsWith("mp:external/")) {
        // Extract original URL embedded in mp:external/hash/https/domain.com/...
        const parts = asset.split("/http");
        if (parts.length > 1) {
          return "http" + parts[1];
        }
        return `https://media.discordapp.net/external/${asset.replace("mp:external/", "")}`;
      }

      if (act.application_id) {
        return `https://cdn.discordapp.com/app-assets/${act.application_id}/${asset}.png`;
      }

      return null;
    }

    async function fetchPresence() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`);
        const json = await res.json();
        if (!json.success) return;

        const data = json.data;
        const typeEl = document.getElementById("status-type");
        const titleEl = document.getElementById("status-title");
        const detailsEl = document.getElementById("status-details");
        const stateEl = document.getElementById("status-state");
        const imgEl = document.getElementById("card-image");

        if (data.listening_to_spotify) {
          typeEl.innerText = "LISTENING TO SPOTIFY";
          titleEl.innerText = data.spotify.song;
          detailsEl.innerText = `by ${data.spotify.artist}`;
          stateEl.innerText = data.spotify.album;
          activeTimestamps = {
            start: data.spotify.timestamps?.start,
            end: data.spotify.timestamps?.end
          };
        } else if (data.activities && data.activities.length > 0) {
          const act = data.activities.find(a => a.type !== 4) || data.activities[0];
          
          typeEl.innerText = activityTypes[act.type] || "ACTIVITY";
          activeTimestamps = act.timestamps || null;

          if (act.type === 4) {
            titleEl.innerText = act.state || act.name;
            detailsEl.innerText = act.emoji ? act.emoji.name : "";
            stateEl.innerText = (data.discord_status || "ONLINE").toUpperCase();
          } else if (act.details) {
            // Priority formatting for SpotiDuck and Rich Presence apps
            titleEl.innerText = act.details;
            detailsEl.innerText = act.state || act.name;
            stateEl.innerText = act.assets?.large_text || act.name;
          } else {
            titleEl.innerText = act.name;
            detailsEl.innerText = act.details || "";
            stateEl.innerText = act.state || "Active";
          }

          const imgUrl = getImageUrl(data, act);
          if (imgUrl) {
            imgEl.src = imgUrl;
            imgEl.style.display = "block";
          } else {
            imgEl.style.display = "none";
          }
        } else {
          typeEl.innerText = "DISCORD STATUS";
          titleEl.innerText = "No Active Activity";
          detailsEl.innerText = "Online";
          stateEl.innerText = data.discord_status.toUpperCase();
          activeTimestamps = null;
          imgEl.style.display = "none";
        }

        updateTimer();
      } catch (e) {
        console.error(e);
      }
    }

    fetchPresence();
    setInterval(fetchPresence, 5000);
    setInterval(updateTimer, 1000);
  </script>
</body>
</html>
